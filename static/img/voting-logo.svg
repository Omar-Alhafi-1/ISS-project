<?xml version="1.0" encoding="UTF-8"?>
<svg width="200px" height="200px" viewBox="0 0 200 200" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <circle fill="#2563EB" cx="100" cy="100" r="90"/>
        <g transform="translate(40, 40)">
            <!-- Ballot Box -->
            <rect fill="#FFFFFF" x="20" y="40" width="80" height="80" rx="4"/>
            <rect fill="#E5E7EB" x="30" y="50" width="60" height="10" rx="2"/>
            
            <!-- QR Code Representation -->
            <rect fill="#000000" x="35" y="70" width="50" height="40" rx="2"/>
            <rect fill="#FFFFFF" x="40" y="75" width="5" height="5"/>
            <rect fill="#FFFFFF" x="50" y="75" width="5" height="5"/>
            <rect fill="#FFFFFF" x="60" y="75" width="5" height="5"/>
            <rect fill="#FFFFFF" x="70" y="75" width="5" height="5"/>
            
            <rect fill="#FFFFFF" x="40" y="85" width="5" height="5"/>
            <rect fill="#FFFFFF" x="50" y="85" width="5" height="5"/>
            <rect fill="#FFFFFF" x="60" y="85" width="5" height="5"/>
            <rect fill="#FFFFFF" x="75" y="85" width="5" height="5"/>
            
            <rect fill="#FFFFFF" x="40" y="95" width="5" height="5"/>
            <rect fill="#FFFFFF" x="55" y="95" width="5" height="5"/>
            <rect fill="#FFFFFF" x="65" y="95" width="5" height="5"/>
            <rect fill="#FFFFFF" x="75" y="95" width="5" height="5"/>
            
            <rect fill="#FFFFFF" x="40" y="105" width="5" height="5"/>
            <rect fill="#FFFFFF" x="50" y="105" width="5" height="5"/>
            <rect fill="#FFFFFF" x="60" y="105" width="5" height="5"/>
            <rect fill="#FFFFFF" x="70" y="105" width="5" height="5"/>
            
            <!-- Checkmark -->
            <path d="M20,30 L40,50 L80,10" stroke="#4ADE80" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            
            <!-- Lock Symbol -->
            <rect fill="#F472B6" x="90" y="15" width="20" height="15" rx="2"/>
            <rect fill="#F472B6" x="95" y="5" width="10" height="15" rx="5"/>
        </g>
    </g>
</svg>