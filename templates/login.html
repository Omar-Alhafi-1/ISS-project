<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Secure Voting System</title>
    <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3>Voter Login</h3>
                    </div>
                    <div class="card-body">
                        <form method="POST" id="loginForm">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <!-- Face verification has been moved to a separate mandatory step -->
                            <input type="hidden" name="face_image_data" id="faceImageData">
                            <div class="alert alert-info">
                                <i class="fa fa-info-circle"></i> 
                                After login, you will be required to complete a face verification step.
                            </div>
                            <div class="mb-3">
                                <a href="{{ url_for('register') }}">New voter? Register here</a>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Login</button>
                                <a href="{{ url_for('forgot_password') }}" class="btn btn-link">Forgot Password?</a>
                                <a href="{{ url_for('register') }}" class="btn btn-link">Register</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="row justify-content-center mt-4">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3>Live Voting Status</h3>
                    </div>
                    <div class="card-body">
                        <div class="stats mb-4">
                            <div class="row text-center">
                                <div class="col-md-4">
                                    <h5>Total Voters</h5>
                                    <p id="totalVoters" class="h3">0</p>
                                </div>
                                <div class="col-md-4">
                                    <h5>Voted</h5>
                                    <p id="votedCount" class="h3">0</p>
                                </div>
                                <div class="col-md-4">
                                    <h5>Remaining</h5>
                                    <p id="remainingVoters" class="h3">0</p>
                                </div>
                            </div>
                        </div>
                        <h4>Candidate Results</h4>
                        <div id="candidateResults"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Face verification has been moved to the liveness_check page
        // This script now only handles the dashboard updates

        // Dashboard update
        function updateDashboard() {
            fetch('/dashboard_data')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('totalVoters').textContent = data.total_voters;
                    document.getElementById('votedCount').textContent = data.voted_count;
                    document.getElementById('remainingVoters').textContent = data.remaining_voters;

                    const resultsHtml = data.candidate_votes.map(candidate => `
                        <div class="candidate-result mb-3">
                            <div class="name">${candidate.name}</div>
                            <div class="progress">
                                <div class="progress-bar" role="progressbar" 
                                     style="width: ${candidate.percentage}%" 
                                     aria-valuenow="${candidate.percentage}" 
                                     aria-valuemin="0" aria-valuemax="100">
                                    ${candidate.votes} (${candidate.percentage.toFixed(1)}%)
                                </div>
                            </div>
                        </div>
                    `).join('');
                    document.getElementById('candidateResults').innerHTML = resultsHtml;
                });
        }

        // Update dashboard every 5 seconds
        updateDashboard();
        setInterval(updateDashboard, 5000);
    </script>
</body>
</html>
