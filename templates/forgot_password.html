<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Secure Voting System</title>
    <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3>Forgot Password</h3>
                    </div>
                    <div class="card-body">
                        <div id="alert" class="alert" style="display: none;"></div>
                        <form id="forgotPasswordForm">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Send Reset Link</button>
                                <a href="{{ url_for('login') }}" class="btn btn-link">Back to Login</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const alert = document.getElementById('alert');
            alert.style.display = 'none';
            
            try {
                const response = await fetch('{{ url_for("forgot_password") }}', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                alert.textContent = data.message || data.error;
                alert.className = `alert alert-${response.ok ? 'success' : 'danger'}`;
                alert.style.display = 'block';
                
                if (response.ok) {
                    this.reset();
                }
            } catch (error) {
                alert.textContent = 'An error occurred. Please try again.';
                alert.className = 'alert alert-danger';
                alert.style.display = 'block';
            }
        });
    </script>
</body>
</html>
